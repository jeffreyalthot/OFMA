{% extends "base.html" %}

{% block content %}
<div class="auth-container">
  <h2>{{ tr("login") }}</h2>
  <form method="post">
    <input type="email" name="email" placeholder="{{ tr('email') }}" required />
    <input type="password" name="password" placeholder="{{ tr('password') }}" required />
    <button type="submit">{{ tr("login_submit") }}</button>
  </form>
</div>
{% endblock %}
